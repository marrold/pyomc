[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyomc-rfp"
version = "0.5.0"
description = "A dependency-free Python replacement for the SIP-DECT OM Configurator"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Matthew"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Networking",
]

[project.scripts]
pyomc = "pyomc.cli:main"

[tool.setuptools.packages.find]
include = ["pyomc*"]

[tool.setuptools.package-data]
pyomc = ["py.typed"]

